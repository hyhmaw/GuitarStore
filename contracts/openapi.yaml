openapi: 3.1.0
info:
  title: YŌJU GUITARS API
  version: 0.1.0
  description: API для інтернет-магазину музичних інструментів
servers:
- url: http://localhost:3000
  description: Локальний сервер
tags:
- name: Products
  description: Робота з товарами
- name: Auth
  description: Реєстрація та автентифікація
- name: Orders
  description: Робота із замовленнями
- name: Reviews
  description: Робота з відгуками
- name: Manager
  description: Операції менеджера магазину
- name: Administrator
  description: Операції адміністратора
paths:
  /products:
    get:
      tags:
      - Products
      operationId: getProducts
      summary: Отримати каталог товарів
      parameters:
      - name: cursor
        in: query
        required: false
        description: Курсор для отримання наступної частини каталогу
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Кількість товарів у відповіді
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: categoryId
        in: query
        required: false
        description: Фільтр за категорією
        schema:
          type: integer
          minimum: 1
      - name: minPrice
        in: query
        required: false
        description: Мінімальна ціна у мінімальних грошових одиницях
        schema:
          type: integer
          minimum: 0
      - name: maxPrice
        in: query
        required: false
        description: Максимальна ціна у мінімальних грошових одиницях
        schema:
          type: integer
          minimum: 0
      - name: inStock
        in: query
        required: false
        description: Фільтр за наявністю товару
        schema:
          type: boolean
      - name: search
        in: query
        required: false
        description: Пошук за назвою та описом
        schema:
          type: string
      responses:
        '200':
          description: Список товарів успішно отримано
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer
                    examples:
                    - 250
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    description: Курсор для отримання наступної частини каталогу
                    examples:
                    - product_20
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products/{id}:
    get:
      tags:
      - Products
      operationId: getProductById
      summary: Отримати товар за ідентифікатором
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор товару
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Товар успішно отримано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products/{id}/reviews:
    get:
      tags:
      - Reviews
      operationId: getProductReviews
      summary: Отримати відгуки про товар
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор товару
        schema:
          type: integer
          minimum: 1
      - name: cursor
        in: query
        required: false
        description: Курсор для отримання наступної частини відгуків
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Кількість відгуків у відповіді
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Відгуки успішно отримано
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  total:
                    type: integer
                    examples:
                    - 18
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    examples:
                    - review_20
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Reviews
      operationId: createProductReview
      summary: Залишити відгук про придбаний товар
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор товару
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Відгук успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReviewPurchaseRequired'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register:
    post:
      tags:
      - Auth
      operationId: registerUser
      summary: Зареєструвати покупця
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Користувача успішно зареєстровано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/UserAlreadyExists'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: loginUser
      summary: Увійти до системи
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вхід виконано успішно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/me:
    get:
      tags:
      - Auth
      operationId: getCurrentUser
      summary: Відновити поточну сесію
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Поточного користувача отримано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logoutUser
      summary: Завершити поточну сесію
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Сесію успішно завершено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders:
    post:
      tags:
      - Orders
      operationId: createOrder
      summary: Оформити замовлення
      security:
      - sessionCookie: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Унікальний ключ для запобігання повторному створенню замовлення
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Замовлення успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/InsufficientStock'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Orders
      operationId: getMyOrders
      summary: Отримати історію замовлень покупця
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Історію замовлень успішно отримано
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{id}:
    get:
      tags:
      - Orders
      operationId: getOrderById
      summary: Отримати замовлення за ідентифікатором
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор замовлення
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Замовлення успішно отримано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{id}/cancel:
    post:
      tags:
      - Orders
      operationId: cancelOrder
      summary: Скасувати замовлення до відправлення
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор замовлення
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Замовлення успішно скасовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/OrderCannotBeCancelled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /manager/products:
    post:
      tags:
      - Manager
      operationId: createManagerProduct
      summary: Створити товар у категорії менеджера
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Товар успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ManagerCategoryForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /manager/products/{id}:
    patch:
      tags:
      - Manager
      operationId: updateManagerProduct
      summary: Редагувати товар у категорії менеджера
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор товару
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Товар успішно оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ManagerCategoryForbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /manager/products/{id}/images:
    post:
      tags:
      - Manager
      operationId: uploadManagerProductImage
      summary: Завантажити зображення товару
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор товару
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Зображення успішно завантажено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ManagerCategoryForbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /manager/products/{id}/stock:
    patch:
      tags:
      - Manager
      operationId: updateManagerProductStock
      summary: Змінити залишок товару
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор товару
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockRequest'
      responses:
        '200':
          description: Залишок товару успішно оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ManagerCategoryForbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /manager/orders/{id}/status:
    patch:
      tags:
      - Manager
      operationId: updateManagerOrderStatus
      summary: Змінити статус замовлення
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор замовлення
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Статус замовлення успішно оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidOrderStatusTransition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /manager/reviews/{id}/hide:
    patch:
      tags:
      - Manager
      operationId: hideReportedReview
      summary: Приховати відгук зі скаргою
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор відгуку
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Відгук успішно приховано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/ReviewHasNoComplaint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ReviewNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/categories:
    post:
      tags:
      - Administrator
      operationId: createCategory
      summary: Створити категорію
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Категорію успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorForbidden'
        '409':
          $ref: '#/components/responses/CategoryAlreadyExists'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Administrator
      operationId: getCategories
      summary: Отримати список категорій
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Список категорій успішно отримано
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/categories/{id}:
    patch:
      tags:
      - Administrator
      operationId: updateCategory
      summary: Редагувати категорію
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор категорії
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Категорію успішно оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorForbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryAlreadyExists'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Administrator
      operationId: deleteCategory
      summary: Видалити категорію
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор категорії
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: Категорію успішно видалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorForbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryInUse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/managers:
    post:
      tags:
      - Administrator
      operationId: createManager
      summary: Створити обліковий запис менеджера
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagerRequest'
      responses:
        '201':
          description: Менеджера успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorForbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/UserAlreadyExists'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Administrator
      operationId: getManagers
      summary: Отримати список менеджерів
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Список менеджерів успішно отримано
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/managers/{id}:
    patch:
      tags:
      - Administrator
      operationId: updateManager
      summary: Редагувати менеджера та його категорію
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор менеджера
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagerRequest'
      responses:
        '200':
          description: Менеджера успішно оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorForbidden'
        '404':
          $ref: '#/components/responses/ManagerNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Administrator
      operationId: deleteManager
      summary: Видалити менеджера
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор менеджера
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: Менеджера успішно видалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorForbidden'
        '404':
          $ref: '#/components/responses/ManagerNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/reports/sales:
    get:
      tags:
      - Administrator
      operationId: getSalesReport
      summary: Отримати звіт з продажів за період
      description: Звіт формується одним API-запитом за вказаний період.
      security:
      - sessionCookie: []
      parameters:
      - name: from
        in: query
        required: true
        description: Початкова дата періоду
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        description: Кінцева дата періоду
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Звіт успішно сформовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Product:
      type: object
      required:
      - id
      - name
      - description
      - price
      - stockQuantity
      - isLimited
      - category
      - images
      - specifications
      - tags
      properties:
        id:
          type: integer
          examples:
          - 1
        name:
          type: string
          examples:
          - Fender Player Stratocaster
        description:
          type: string
          examples:
          - Electric guitar with three single-coil pickups
        price:
          type: integer
          description: Ціна у мінімальних грошових одиницях
          examples:
          - 359900
        stockQuantity:
          type: integer
          minimum: 0
          description: Фактична кількість товару на складі
          examples:
          - 5
        isLimited:
          type: boolean
          description: Ознака лімітованого товару
          examples:
          - true
        category:
          $ref: '#/components/schemas/Category'
        images:
          type: array
          items:
            type: string
            format: uri
          examples:
          - - https://example.com/images/guitar-1.jpg
            - https://example.com/images/guitar-2.jpg
        specifications:
          type: object
          additionalProperties:
            type: string
          examples:
          - body: Alder
            color: Black
            pickups: Three single-coil pickups
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    Category:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          examples:
          - 1
        name:
          type: string
          examples:
          - Electric Guitars
    Tag:
      type: object
      required:
      - id
      - name
      - addedAt
      properties:
        id:
          type: integer
          examples:
          - 1
        name:
          type: string
          examples:
          - rock
        addedAt:
          type: string
          format: date-time
          examples:
          - '2026-10-23T18:00:00Z'
    User:
      type: object
      required:
      - id
      - name
      - email
      - role
      properties:
        id:
          type: integer
          examples:
          - 1
        name:
          type: string
          examples:
          - Anna Kovalenko
        email:
          type: string
          format: email
          examples:
          - anna@example.com
        role:
          type: string
          enum:
          - customer
          - manager
          - administrator
          examples:
          - customer
        managedCategoryId:
          type:
          - integer
          - 'null'
          description: Категорія, якою керує менеджер; для інших ролей значення null
          examples:
          - 2
    RegisterRequest:
      type: object
      required:
      - name
      - email
      - password
      properties:
        name:
          type: string
          minLength: 2
          examples:
          - Anna Kovalenko
        email:
          type: string
          format: email
          examples:
          - anna@example.com
        password:
          type: string
          format: password
          minLength: 8
          examples:
          - StrongPassword123
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          examples:
          - anna@example.com
        password:
          type: string
          format: password
          examples:
          - StrongPassword123
    CreateOrderRequest:
      type: object
      required:
      - deliveryAddress
      - items
      properties:
        deliveryAddress:
          type: string
          examples:
          - Odesa, Deribasivska Street, 10
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - productId
            - quantity
            properties:
              productId:
                type: integer
                minimum: 1
                examples:
                - 15
              quantity:
                type: integer
                minimum: 1
                examples:
                - 1
    Order:
      type: object
      required:
      - id
      - status
      - deliveryAddress
      - totalPrice
      - items
      - createdAt
      properties:
        id:
          type: integer
          examples:
          - 101
        status:
          type: string
          enum:
          - accepted
          - assembled
          - shipped
          - cancelled
          examples:
          - accepted
        deliveryAddress:
          type: string
          examples:
          - Odesa, Deribasivska Street, 10
        totalPrice:
          type: integer
          description: Загальна сума у мінімальних грошових одиницях
          examples:
          - 359900
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        createdAt:
          type: string
          format: date-time
          examples:
          - '2026-10-23T20:00:00Z'
    OrderItem:
      type: object
      required:
      - productId
      - productName
      - quantity
      - priceAtPurchase
      properties:
        productId:
          type: integer
          examples:
          - 15
        productName:
          type: string
          examples:
          - Fender Player Stratocaster
        quantity:
          type: integer
          minimum: 1
          examples:
          - 1
        priceAtPurchase:
          type: integer
          description: Ціна товару, зафіксована на момент покупки
          examples:
          - 359900
    Review:
      type: object
      required:
      - id
      - productId
      - userId
      - userName
      - rating
      - comment
      - createdAt
      properties:
        id:
          type: integer
          examples:
          - 301
        productId:
          type: integer
          examples:
          - 15
        userId:
          type: integer
          examples:
          - 8
        userName:
          type: string
          examples:
          - Anna Kovalenko
        rating:
          type: integer
          minimum: 1
          maximum: 5
          examples:
          - 5
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          examples:
          - Great guitar with excellent sound and build quality.
        isHidden:
          type: boolean
          description: Ознака прихованого менеджером відгуку
          default: false
          examples:
          - false
        hasComplaint:
          type: boolean
          description: Ознака наявності скарги на відгук
          default: false
          examples:
          - true
        createdAt:
          type: string
          format: date-time
          examples:
          - '2026-10-23T20:30:00Z'
    CreateReviewRequest:
      type: object
      required:
      - rating
      - comment
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          examples:
          - 5
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          examples:
          - Great guitar with excellent sound and build quality.
    CreateProductRequest:
      type: object
      required:
      - name
      - description
      - price
      - stockQuantity
      - isLimited
      - categoryId
      - specifications
      - tagIds
      properties:
        name:
          type: string
          minLength: 1
          examples:
          - Gibson Les Paul Standard
        description:
          type: string
          minLength: 1
          examples:
          - Electric guitar with mahogany body and humbucker pickups
        price:
          type: integer
          minimum: 0
          description: Ціна у мінімальних грошових одиницях
          examples:
          - 799900
        stockQuantity:
          type: integer
          minimum: 0
          examples:
          - 4
        isLimited:
          type: boolean
          examples:
          - false
        categoryId:
          type: integer
          minimum: 1
          examples:
          - 1
        specifications:
          type: object
          additionalProperties:
            type: string
          examples:
          - body: Mahogany
            color: Heritage Cherry Sunburst
        tagIds:
          type: array
          items:
            type: integer
            minimum: 1
          examples:
          - - 1
            - 3
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          examples:
          - Gibson Les Paul Standard 60s
        description:
          type: string
          minLength: 1
        price:
          type: integer
          minimum: 0
          description: Ціна у мінімальних грошових одиницях
        isLimited:
          type: boolean
        specifications:
          type: object
          additionalProperties:
            type: string
        tagIds:
          type: array
          items:
            type: integer
            minimum: 1
    ProductImage:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          examples:
          - https://example.com/images/guitar-new.jpg
    UpdateStockRequest:
      type: object
      required:
      - stockQuantity
      properties:
        stockQuantity:
          type: integer
          minimum: 0
          examples:
          - 7
    UpdateOrderStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - assembled
          - shipped
          examples:
          - assembled
    CreateCategoryRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 2
          examples:
          - Electric Guitars
    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          examples:
          - Limited Guitars
    CreateManagerRequest:
      type: object
      required:
      - name
      - email
      - password
      - managedCategoryId
      properties:
        name:
          type: string
          minLength: 2
          examples:
          - Oleksii Melnyk
        email:
          type: string
          format: email
          examples:
          - manager@example.com
        password:
          type: string
          format: password
          minLength: 8
          examples:
          - StrongPassword123
        managedCategoryId:
          type: integer
          minimum: 1
          examples:
          - 2
    UpdateManagerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          examples:
          - Oleksii Melnyk
        managedCategoryId:
          type: integer
          minimum: 1
          examples:
          - 3
    SalesReport:
      type: object
      required:
      - from
      - to
      - totalRevenue
      - totalOrders
      - totalItemsSold
      - products
      properties:
        from:
          type: string
          format: date
          examples:
          - '2026-10-01'
        to:
          type: string
          format: date
          examples:
          - '2026-10-31'
        totalRevenue:
          type: integer
          description: Загальна сума продажів у мінімальних грошових одиницях
          examples:
          - 12599000
        totalOrders:
          type: integer
          examples:
          - 42
        totalItemsSold:
          type: integer
          examples:
          - 58
        products:
          type: array
          items:
            $ref: '#/components/schemas/SalesReportItem'
    SalesReportItem:
      type: object
      required:
      - productId
      - productName
      - quantitySold
      - revenue
      properties:
        productId:
          type: integer
          examples:
          - 15
        productName:
          type: string
          examples:
          - Fender Player Stratocaster
        quantitySold:
          type: integer
          examples:
          - 7
        revenue:
          type: integer
          description: Сума продажів товару у мінімальних грошових одиницях
          examples:
          - 2519300
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionId
  responses:
    ProductNotFound:
      description: Товар не знайдено
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - product-not-found
              title:
                type: string
                examples:
                - Product Not Found
              status:
                type: integer
                examples:
                - 404
    ValidationError:
      description: Дані запиту не пройшли валідацію
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - validation-error
              title:
                type: string
                examples:
                - Validation Error
              status:
                type: integer
                examples:
                - 400
    UserAlreadyExists:
      description: Користувач із такою електронною поштою вже існує
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - user-already-exists
              title:
                type: string
                examples:
                - User Already Exists
              status:
                type: integer
                examples:
                - 409
    InvalidCredentials:
      description: Неправильна електронна пошта або пароль
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - invalid-credentials
              title:
                type: string
                examples:
                - Invalid Credentials
              status:
                type: integer
                examples:
                - 401
    Unauthorized:
      description: Користувач не авторизований
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - unauthorized
              title:
                type: string
                examples:
                - Unauthorized
              status:
                type: integer
                examples:
                - 401
    ReviewPurchaseRequired:
      description: Відгук може залишити лише користувач, який придбав цей товар
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - review-purchase-required
              title:
                type: string
                examples:
                - Product Purchase Required
              status:
                type: integer
                examples:
                - 403
    InsufficientStock:
      description: Недостатня кількість товару на складі
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - insufficient-stock
              title:
                type: string
                examples:
                - Insufficient Stock
              status:
                type: integer
                examples:
                - 409
    OrderNotFound:
      description: Замовлення не знайдено
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - order-not-found
              title:
                type: string
                examples:
                - Order Not Found
              status:
                type: integer
                examples:
                - 404
    OrderCannotBeCancelled:
      description: Замовлення вже не можна скасувати
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - order-cannot-be-cancelled
              title:
                type: string
                examples:
                - Order Cannot Be Cancelled
              status:
                type: integer
                examples:
                - 400
    ManagerCategoryForbidden:
      description: Менеджер не має доступу до товарів іншої категорії
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - manager-category-forbidden
              title:
                type: string
                examples:
                - Manager Category Forbidden
              status:
                type: integer
                examples:
                - 403
    InvalidOrderStatusTransition:
      description: Неприпустимий перехід між статусами замовлення
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - invalid-order-status-transition
              title:
                type: string
                examples:
                - Invalid Order Status Transition
              status:
                type: integer
                examples:
                - 400
    ReviewNotFound:
      description: Відгук не знайдено
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - review-not-found
              title:
                type: string
                examples:
                - Review Not Found
              status:
                type: integer
                examples:
                - 404
    ReviewHasNoComplaint:
      description: Відгук не має скарги та не може бути прихований цією операцією
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - review-has-no-complaint
              title:
                type: string
                examples:
                - Review Has No Complaint
              status:
                type: integer
                examples:
                - 400
    InternalServerError:
      description: Внутрішня помилка сервера
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - internal-server-error
              title:
                type: string
                examples:
                - Internal Server Error
              status:
                type: integer
                examples:
                - 500
    AdministratorForbidden:
      description: Доступ дозволено лише адміністратору
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - administrator-forbidden
              title:
                type: string
                examples:
                - Administrator Access Required
              status:
                type: integer
                examples:
                - 403
    CategoryNotFound:
      description: Категорію не знайдено
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - category-not-found
              title:
                type: string
                examples:
                - Category Not Found
              status:
                type: integer
                examples:
                - 404
    CategoryAlreadyExists:
      description: Категорія з такою назвою вже існує
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - category-already-exists
              title:
                type: string
                examples:
                - Category Already Exists
              status:
                type: integer
                examples:
                - 409
    CategoryInUse:
      description: Категорію не можна видалити, оскільки вона використовується товарами або менеджером
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - category-in-use
              title:
                type: string
                examples:
                - Category In Use
              status:
                type: integer
                examples:
                - 409
    ManagerNotFound:
      description: Менеджера не знайдено
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                examples:
                - manager-not-found
              title:
                type: string
                examples:
                - Manager Not Found
              status:
                type: integer
                examples:
                - 404
