openapi: 3.1.0

info:
  title: YŌJU GUITARS API
  version: 0.1.0
  description: API для інтернет-магазину музичних інструментів

servers:
  - url: http://localhost:3000
    description: Локальний сервер

tags:
  - name: Products
    description: Робота з товарами

  - name: Auth
    description: Реєстрація та автентифікація

  - name: Orders
    description: Робота із замовленнями

  - name: Reviews
    description: Робота з відгуками


paths:
  /products:
    get:
      tags:
        - Products

      operationId: getProducts
      summary: Отримати каталог товарів

      parameters:
        - name: cursor
          in: query
          required: false
          description: Курсор для отримання наступної частини каталогу
          schema:
            type: string

        - name: limit
          in: query
          required: false
          description: Кількість товарів у відповіді
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20

        - name: categoryId
          in: query
          required: false
          description: Фільтр за категорією
          schema:
            type: integer
            minimum: 1

        - name: minPrice
          in: query
          required: false
          description: Мінімальна ціна у мінімальних грошових одиницях
          schema:
            type: integer
            minimum: 0

        - name: maxPrice
          in: query
          required: false
          description: Максимальна ціна у мінімальних грошових одиницях
          schema:
            type: integer
            minimum: 0

        - name: inStock
          in: query
          required: false
          description: Фільтр за наявністю товару
          schema:
            type: boolean

        - name: search
          in: query
          required: false
          description: Пошук за назвою та описом
          schema:
            type: string

      responses:
        '200':
          description: Список товарів успішно отримано
          content:
            application/json:
              schema:
                type: object

                required:
                  - items
                  - total

                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

                  total:
                    type: integer
                    examples:
                      - 250

                  nextCursor:
                    type:
                      - string
                      - 'null'
                    description: Курсор для отримання наступної частини каталогу
                    examples:
                      - product_20

        '500':
          $ref: '#/components/responses/InternalServerError'


  /products/{id}:
    get:
      tags:
        - Products

      operationId: getProductById
      summary: Отримати товар за ідентифікатором

      parameters:
        - name: id
          in: path
          required: true
          description: Ідентифікатор товару
          schema:
            type: integer
            minimum: 1

      responses:
        '200':
          description: Товар успішно отримано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '404':
          $ref: '#/components/responses/ProductNotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /products/{id}/reviews:
    get:
      tags:
        - Reviews

      operationId: getProductReviews
      summary: Отримати відгуки про товар

      parameters:
        - name: id
          in: path
          required: true
          description: Ідентифікатор товару
          schema:
            type: integer
            minimum: 1

        - name: cursor
          in: query
          required: false
          description: Курсор для отримання наступної частини відгуків
          schema:
            type: string

        - name: limit
          in: query
          required: false
          description: Кількість відгуків у відповіді
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20

      responses:
        '200':
          description: Відгуки успішно отримано
          content:
            application/json:
              schema:
                type: object

                required:
                  - items
                  - total

                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'

                  total:
                    type: integer
                    examples:
                      - 18

                  nextCursor:
                    type:
                      - string
                      - 'null'
                    examples:
                      - review_20

        '404':
          $ref: '#/components/responses/ProductNotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Reviews

      operationId: createProductReview
      summary: Залишити відгук про придбаний товар

      security:
        - sessionCookie: []

      parameters:
        - name: id
          in: path
          required: true
          description: Ідентифікатор товару
          schema:
            type: integer
            minimum: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'

      responses:
        '201':
          description: Відгук успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'

        '400':
          $ref: '#/components/responses/ValidationError'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/ReviewPurchaseRequired'

        '404':
          $ref: '#/components/responses/ProductNotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /auth/register:
    post:
      tags:
        - Auth

      operationId: registerUser
      summary: Зареєструвати покупця

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:
        '201':
          description: Користувача успішно зареєстровано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '400':
          $ref: '#/components/responses/ValidationError'

        '409':
          $ref: '#/components/responses/UserAlreadyExists'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /auth/login:
    post:
      tags:
        - Auth

      operationId: loginUser
      summary: Увійти до системи

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Вхід виконано успішно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '401':
          $ref: '#/components/responses/InvalidCredentials'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /auth/me:
    get:
      tags:
        - Auth

      operationId: getCurrentUser
      summary: Відновити поточну сесію

      security:
        - sessionCookie: []

      responses:
        '200':
          description: Поточного користувача отримано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /auth/logout:
    post:
      tags:
        - Auth

      operationId: logoutUser
      summary: Завершити поточну сесію

      security:
        - sessionCookie: []

      responses:
        '204':
          description: Сесію успішно завершено

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /orders:
    post:
      tags:
        - Orders

      operationId: createOrder
      summary: Оформити замовлення

      security:
        - sessionCookie: []

      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Унікальний ключ для запобігання повторному створенню замовлення
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'

      responses:
        '201':
          description: Замовлення успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '400':
          $ref: '#/components/responses/ValidationError'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '409':
          $ref: '#/components/responses/InsufficientStock'

        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Orders

      operationId: getMyOrders
      summary: Отримати історію замовлень покупця

      security:
        - sessionCookie: []

      responses:
        '200':
          description: Історію замовлень успішно отримано
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /orders/{id}:
    get:
      tags:
        - Orders

      operationId: getOrderById
      summary: Отримати замовлення за ідентифікатором

      security:
        - sessionCookie: []

      parameters:
        - name: id
          in: path
          required: true
          description: Ідентифікатор замовлення
          schema:
            type: integer
            minimum: 1

      responses:
        '200':
          description: Замовлення успішно отримано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/OrderNotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /orders/{id}/cancel:
    post:
      tags:
        - Orders

      operationId: cancelOrder
      summary: Скасувати замовлення до відправлення

      security:
        - sessionCookie: []

      parameters:
        - name: id
          in: path
          required: true
          description: Ідентифікатор замовлення
          schema:
            type: integer
            minimum: 1

      responses:
        '200':
          description: Замовлення успішно скасовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '400':
          $ref: '#/components/responses/OrderCannotBeCancelled'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/OrderNotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'


components:
  schemas:
    Product:
      type: object

      required:
        - id
        - name
        - description
        - price
        - stockQuantity
        - isLimited
        - category
        - images
        - specifications
        - tags

      properties:
        id:
          type: integer
          examples:
            - 1

        name:
          type: string
          examples:
            - Fender Player Stratocaster

        description:
          type: string
          examples:
            - Electric guitar with three single-coil pickups

        price:
          type: integer
          description: Ціна у мінімальних грошових одиницях
          examples:
            - 359900

        stockQuantity:
          type: integer
          minimum: 0
          description: Фактична кількість товару на складі
          examples:
            - 5

        isLimited:
          type: boolean
          description: Ознака лімітованого товару
          examples:
            - true

        category:
          $ref: '#/components/schemas/Category'

        images:
          type: array
          items:
            type: string
            format: uri
          examples:
            - - https://example.com/images/guitar-1.jpg
              - https://example.com/images/guitar-2.jpg

        specifications:
          type: object
          additionalProperties:
            type: string
          examples:
            - body: Alder
              color: Black
              pickups: Three single-coil pickups

        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'


    Category:
      type: object

      required:
        - id
        - name

      properties:
        id:
          type: integer
          examples:
            - 1

        name:
          type: string
          examples:
            - Electric Guitars


    Tag:
      type: object

      required:
        - id
        - name
        - addedAt

      properties:
        id:
          type: integer
          examples:
            - 1

        name:
          type: string
          examples:
            - rock

        addedAt:
          type: string
          format: date-time
          examples:
            - '2026-10-23T18:00:00Z'


    User:
      type: object

      required:
        - id
        - name
        - email
        - role

      properties:
        id:
          type: integer
          examples:
            - 1

        name:
          type: string
          examples:
            - Anna Kovalenko

        email:
          type: string
          format: email
          examples:
            - anna@example.com

        role:
          type: string
          enum:
            - customer
            - manager
            - administrator
          examples:
            - customer


    RegisterRequest:
      type: object

      required:
        - name
        - email
        - password

      properties:
        name:
          type: string
          minLength: 2
          examples:
            - Anna Kovalenko

        email:
          type: string
          format: email
          examples:
            - anna@example.com

        password:
          type: string
          format: password
          minLength: 8
          examples:
            - StrongPassword123


    LoginRequest:
      type: object

      required:
        - email
        - password

      properties:
        email:
          type: string
          format: email
          examples:
            - anna@example.com

        password:
          type: string
          format: password
          examples:
            - StrongPassword123


    CreateOrderRequest:
      type: object

      required:
        - deliveryAddress
        - items

      properties:
        deliveryAddress:
          type: string
          examples:
            - Odesa, Deribasivska Street, 10

        items:
          type: array
          minItems: 1
          items:
            type: object

            required:
              - productId
              - quantity

            properties:
              productId:
                type: integer
                minimum: 1
                examples:
                  - 15

              quantity:
                type: integer
                minimum: 1
                examples:
                  - 1


    Order:
      type: object

      required:
        - id
        - status
        - deliveryAddress
        - totalPrice
        - items
        - createdAt

      properties:
        id:
          type: integer
          examples:
            - 101

        status:
          type: string
          enum:
            - accepted
            - assembled
            - shipped
            - cancelled
          examples:
            - accepted

        deliveryAddress:
          type: string
          examples:
            - Odesa, Deribasivska Street, 10

        totalPrice:
          type: integer
          description: Загальна сума у мінімальних грошових одиницях
          examples:
            - 359900

        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

        createdAt:
          type: string
          format: date-time
          examples:
            - '2026-10-23T20:00:00Z'


    OrderItem:
      type: object

      required:
        - productId
        - productName
        - quantity
        - priceAtPurchase

      properties:
        productId:
          type: integer
          examples:
            - 15

        productName:
          type: string
          examples:
            - Fender Player Stratocaster

        quantity:
          type: integer
          minimum: 1
          examples:
            - 1

        priceAtPurchase:
          type: integer
          description: Ціна товару, зафіксована на момент покупки
          examples:
            - 359900


    Review:
      type: object

      required:
        - id
        - productId
        - userId
        - userName
        - rating
        - comment
        - createdAt

      properties:
        id:
          type: integer
          examples:
            - 301

        productId:
          type: integer
          examples:
            - 15

        userId:
          type: integer
          examples:
            - 8

        userName:
          type: string
          examples:
            - Anna Kovalenko

        rating:
          type: integer
          minimum: 1
          maximum: 5
          examples:
            - 5

        comment:
          type: string
          minLength: 1
          maxLength: 2000
          examples:
            - Great guitar with excellent sound and build quality.

        isHidden:
          type: boolean
          description: Ознака прихованого менеджером відгуку
          default: false
          examples:
            - false

        createdAt:
          type: string
          format: date-time
          examples:
            - '2026-10-23T20:30:00Z'


    CreateReviewRequest:
      type: object

      required:
        - rating
        - comment

      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          examples:
            - 5

        comment:
          type: string
          minLength: 1
          maxLength: 2000
          examples:
            - Great guitar with excellent sound and build quality.


  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionId


  responses:
    ProductNotFound:
      description: Товар не знайдено
      content:
        application/problem+json:
          schema:
            type: object

            required:
              - type
              - title
              - status

            properties:
              type:
                type: string
                examples:
                  - product-not-found

              title:
                type: string
                examples:
                  - Product Not Found

              status:
                type: integer
                examples:
                  - 404


    ValidationError:
      description: Дані запиту не пройшли валідацію
      content:
        application/problem+json:
          schema:
            type: object

            required:
              - type
              - title
              - status

            properties:
              type:
                type: string
                examples:
                  - validation-error

              title:
                type: string
                examples:
                  - Validation Error

              status:
                type: integer
                examples:
                  - 400


    UserAlreadyExists:
      description: Користувач із такою електронною поштою вже існує
      content:
        application/problem+json:
          schema:
            type: object

            required:
              - type
              - title
              - status

            properties:
              type:
                type: string
                examples:
                  - user-already-exists

              title:
                type: string
                examples:
                  - User Already Exists

              status:
                type: integer
                examples:
                  - 409


    InvalidCredentials:
      description: Неправильна електронна пошта або пароль
      content:
        application/problem+json:
          schema:
            type: object

            required:
              - type
              - title
              - status

            properties:
              type:
                type: string
                examples:
                  - invalid-credentials

              title:
                type: string
                examples:
                  - Invalid Credentials

              status:
                type: integer
                examples:
                  - 401


    Unauthorized:
      description: Користувач не авторизований
      content:
        application/problem+json:
          schema:
            type: object

            required:
              - type
              - title
              - status

            properties:
              type:
                type: string
                examples:
                  - unauthorized

              title:
                type: string
                examples:
                  - Unauthorized

              status:
                type: integer
                examples:
                  - 401


    ReviewPurchaseRequired:
      description: Відгук може залишити лише користувач, який придбав цей товар
      content:
        application/problem+json:
          schema:
            type: object

            required:
              - type
              - title
              - status

            properties:
              type:
                type: string
                examples:
                  - review-purchase-required

              title:
                type: string
                examples:
                  - Product Purchase Required

              status:
                type: integer
                examples:
                  - 403


    InsufficientStock:
      description: Недостатня кількість товару на складі
      content:
        application/problem+json:
          schema:
            type: object

            required:
              - type
              - title
              - status

            properties:
              type:
                type: string
                examples:
                  - insufficient-stock

              title:
                type: string
                examples:
                  - Insufficient Stock

              status:
                type: integer
                examples:
                  - 409


    OrderNotFound:
      description: Замовлення не знайдено
      content:
        application/problem+json:
          schema:
            type: object

            required:
              - type
              - title
              - status

            properties:
              type:
                type: string
                examples:
                  - order-not-found

              title:
                type: string
                examples:
                  - Order Not Found

              status:
                type: integer
                examples:
                  - 404


    OrderCannotBeCancelled:
      description: Замовлення вже не можна скасувати
      content:
        application/problem+json:
          schema:
            type: object

            required:
              - type
              - title
              - status

            properties:
              type:
                type: string
                examples:
                  - order-cannot-be-cancelled

              title:
                type: string
                examples:
                  - Order Cannot Be Cancelled

              status:
                type: integer
                examples:
                  - 400


    InternalServerError:
      description: Внутрішня помилка сервера
      content:
        application/problem+json:
          schema:
            type: object

            required:
              - type
              - title
              - status

            properties:
              type:
                type: string
                examples:
                  - internal-server-error

              title:
                type: string
                examples:
                  - Internal Server Error

              status:
                type: integer
                examples:
                  - 500